name: Android CI Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare local.properties
        run: touch local.properties

      - name: Generate CI Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore \
            -alias ci-release-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=PhotonCamera, OU=Fork, O=Fork, L=ID, S=ID, C=ID"

      - name: Build Release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: android
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ci-release-key
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: android
        run: ./gradlew assembleDefaultRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: photoncamera-default-release
          path: app/build/outputs/apk/default/release/*.apk
          retention-days: 7
